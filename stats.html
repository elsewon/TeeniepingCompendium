<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티니핑 도감 - 통계</title>
  <meta name="description" content="목록·이름 맞추기·인기 차트의 방문과 공유 추이.">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="apple-touch-icon" href="images/heartsping.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <span class="logo"><img src="images/favicon.svg" alt=""></span>
        <span>티니핑 도감</span>
      </a>
      <nav class="nav">
        <a href="#" data-random title="아무 티니핑이나 보여줘!">🔮 랜덤핑</a>
        <a href="quiz.html">🧩 이름 맞추기</a>
        <a href="rank.html">🏆 인기 차트</a>
      </nav>
    </div>
  </header>

  <main class="wrap chart-page">
    <h1>통계</h1>

    <ul class="tiles" id="tiles"></ul>
    <p class="tiles-note">목록 · 이름 맞추기 · 인기 차트를 더한 값이에요.</p>

    <h2>누적 그래프</h2>
    <div class="rank-tabs" id="spanTabs">
      <button class="chip active" data-days="7">최근 7일</button>
      <button class="chip" data-days="30">최근 30일</button>
      <button class="chip" data-days="90">최근 90일</button>
      <button class="chip" data-days="360">최근 360일</button>
    </div>

    <figure class="chart-box">
      <div class="chart-legend" id="chartLegend"></div>
      <div class="chart-plot" id="chartPlot"></div>
    </figure>

    <section class="inflow">
      <h2>방문 경로</h2>
      <div class="rank-tabs" id="refTabs">
        <button class="chip active" data-days="1">오늘</button>
        <button class="chip" data-days="7">최근 7일</button>
        <button class="chip" data-days="30">최근 30일</button>
        <button class="chip" data-days="90">최근 90일</button>
        <button class="chip" data-days="360">최근 360일</button>
      </div>
      <ol class="inflow-list" id="inflowList"></ol>
    </section>

    <div class="chart-actions">
      <button class="chip" id="csvDownload" type="button">CSV 내려받기</button>
    </div>
  </main>

  <footer class="footer">
    <p class="stats" id="statsBox" hidden>
      <a class="stats-link" href="stats.html">통계</a> · <span id="stats"></span>
    </p>
    <p><a href="mailto:papa.ping@icloud.com">papa.ping@icloud.com</a> · 2026 · 딸에게 보여주려고 만든 비공식 팬 페이지입니다.
       광고나 후원 등 어떤 형태의 수익화도 하지 않습니다.</p>
    <p>캐릭터 이름·이미지 등 모든 권리는 <a href="https://samg.net/" rel="noopener nofollow" target="_blank">SAMG엔터테인먼트</a>에 있습니다.
       마법과 에피소드 줄거리 출처: <a href="https://namu.wiki/w/티니핑" rel="noopener nofollow" target="_blank">나무위키</a>
       (<a href="https://creativecommons.org/licenses/by-nc-sa/2.0/kr/" rel="noopener nofollow" target="_blank">CC BY-NC-SA 2.0 KR</a>)</p>
  </footer>

  <script src="data/teeniepings.js"></script>
  <script src="js/util.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/chart.js"></script>
</body>
</html>

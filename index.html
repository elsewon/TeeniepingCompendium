<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티니핑 도감</title>
  <meta name="description" content="티니핑을 한곳에. 이름으로 찾고 기수·등급으로 골라 보세요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="티니핑 도감">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="티니핑 도감">
  <meta property="og:description" content="티니핑을 한곳에. 이름으로 찾고 기수·등급으로 골라 보세요.">
  <meta property="og:url" content="https://elsewon.github.io/TeeniepingCompendium/">
  <meta property="og:image" content="https://elsewon.github.io/TeeniepingCompendium/images/og/site.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="티니핑 도감">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="apple-touch-icon" href="images/heartsping.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <span class="logo"><img src="images/favicon.svg" alt=""></span>
        <span>티니핑 도감</span>
      </a>
      <nav class="nav">
        <a href="#" data-random title="아무 티니핑이나 보여줘!">🔮 랜덤핑</a>
        <a href="quiz.html">🧩 이름 맞추기</a>
        <a href="rank.html">🏆 인기 차트</a>
      </nav>
      <button class="share-btn" type="button" data-share aria-label="이 페이지 공유하기" title="이 페이지 공유하기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 헤더와 하나의 면처럼 이어지도록 main 밖에 두어 화면 전체 폭을 쓴다.
       스크롤해도 검색·필터는 상단에 고정되고 목록만 지나간다. -->
  <div class="sticky-bar">
    <div class="wrap">
      <section class="controls">
        <div class="search-box">
          <input id="search" type="text" placeholder="이름·마법·에피소드 검색" autocomplete="off">
          <button class="clear-btn" id="clearSearch" type="button" aria-label="검색어 지우기" hidden>×</button>
          <!-- 말해서 찾기. 음성 인식이 없는 브라우저에서는 js/list.js 가 감춘다 -->
          <button class="mic-btn" id="micSearch" type="button" aria-label="말해서 찾기" title="말해서 찾기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
              <line x1="12" y1="17.5" x2="12" y2="21"/>
            </svg>
          </button>
        </div>
        <div class="filter-group" id="seasonFilters">
          <span class="filter-label">기수</span>
        </div>
        <div class="filter-group" id="gradeFilters">
          <span class="filter-label">등급</span>
        </div>
      </section>
      <p class="result-count" id="count"></p>
    </div>
  </div>

  <main class="wrap">
    <section class="grid" id="grid"></section>
  </main>

  <footer class="footer">
    <p class="stats" id="statsBox" hidden>
      <a class="stats-link" href="stats.html">방문 통계</a> · <span id="stats"></span>
    </p>
    <p><a href="mailto:papa.ping@icloud.com">papa.ping@icloud.com</a> · 2026 · 딸에게 보여주려고 만든 비공식 팬 페이지입니다.
       광고나 후원 등 어떤 형태의 수익화도 하지 않습니다.</p>
    <p>캐릭터 이름·이미지 등 모든 권리는 <a href="https://samg.net/" rel="noopener nofollow" target="_blank">SAMG엔터테인먼트</a>에 있습니다.
       마법과 에피소드 줄거리 출처: <a href="https://namu.wiki/w/티니핑" rel="noopener nofollow" target="_blank">나무위키</a>
       (<a href="https://creativecommons.org/licenses/by-nc-sa/2.0/kr/" rel="noopener nofollow" target="_blank">CC BY-NC-SA 2.0 KR</a>)</p>
  </footer>

  <script src="data/teeniepings.js"></script>
  <script src="js/util.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/list.js"></script>
</body>
</html>

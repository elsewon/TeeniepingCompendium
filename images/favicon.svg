<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 티니핑 파비콘: 팅클퍼프(반짝임)를 두른 하트.
       16px 로 줄어들어도 형태가 뭉개지지 않도록 요소를 최소화했다. -->
  <defs>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ec7"/>
      <stop offset="0.55" stop-color="#ff6fa5"/>
      <stop offset="1" stop-color="#e0459a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0f7"/>
      <stop offset="1" stop-color="#ffe0ef"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#bg)"/>

  <!-- 하트 -->
  <path d="M16 27.2C7.4 21.6 3.6 17.2 3.6 12.6 3.6 8.5 6.8 5.4 10.8 5.4c2.2 0 4.1 1 5.2 2.6 1.1-1.6 3-2.6 5.2-2.6 4 0 7.2 3.1 7.2 7.2 0 4.6-3.8 9-12.4 14.6z"
        fill="url(#heart)"/>
  <!-- 하이라이트: 입체감 -->
  <path d="M10.6 8.6c-1.9 0-3.4 1.5-3.4 3.4 0 .7.2 1.4.5 2 .4-2.6 1.9-4.4 4.3-5.1-.4-.2-.9-.3-1.4-.3z"
        fill="#fff" opacity="0.55"/>

  <!-- 팅클퍼프(반짝임) -->
  <path d="M25.5 6.2l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z" fill="#ffd76a"/>
  <path d="M6.2 20.4l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="#a78bfa"/>
</svg>
